<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FigurePreflight · 科研图件体检台</title><link rel="stylesheet" href="/app.css"></head>
<body><header><p class="eyebrow">FIGURE PREFLIGHT / LOCAL</p><h1>在最终版面尺寸，检查你的图。</h1><p>导入保留文字的 SVG，定位小字与细线，对照四幅预览，并保存本地检查报告。</p></header>
<main><section class="controls" aria-label="检查设置"><div id="drop-zone" class="drop-zone"><label for="file">选择或拖入 SVG 文件</label><input id="file" type="file" accept=".svg,image/svg+xml"><button id="example" type="button">载入 85 mm 坏图示例</button><p>文件在此浏览器中处理；原文件保持不变。</p></div><div class="fields"><label>最终宽度 / mm<input id="width" type="number" min="1" max="500" step="0.1" value="85"></label><label>最小字号 / pt<input id="font-threshold" type="number" min="1" max="72" step="0.1" value="6"></label><label>最小线宽 / pt<input id="stroke-threshold" type="number" min="0.01" max="10" step="0.01" value="0.25"></label></div><div class="actions"><button id="cancel" disabled>取消本次检查</button><button id="save-html" disabled>保存 HTML 报告</button><button id="save-json" disabled>保存 JSON 报告</button></div><p id="input-status" role="status">正在加载本地字体…</p><p class="muted">HTML 包含图中内容；JSON 保存数值与状态，不嵌入 SVG 或完整图中文字。</p></section>
<section id="results" aria-label="检查结果"><p class="empty">导入图件后，四幅预览与检查结果将在这里显示。</p></section>
<section class="manual" aria-label="人工配色复核"><h2>人工配色复核</h2><p>灰度与两种色觉模拟用于观察线条、图例和分组是否易于区分。模拟采用 Machado 模型，强度 100%。</p><label>复核状态<select id="review-status"><option value="not-reviewed">尚未复核</option><option value="needs-change">需要修改</option><option value="reviewed">已人工复核</option></select></label><label>观察备注<textarea id="review-note" rows="3" placeholder="记录查看条件、难以区分的位置与修改建议"></textarea></label></section><div id="measure-stage" hidden></div></main>
<footer>FigurePreflight · 保留文字覆盖范围 / 路径文字仍需人工检查 · 本地处理，无历史记录</footer><script type="module" src="/app.js"></script></body></html>
